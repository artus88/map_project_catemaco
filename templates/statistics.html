
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Estadísticas - Municipio {{ mun_id }}</title>

  <!-- Bootstrap Styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    /* Estilo para asegurar que los gráficos tengan una altura mínima y se vean bien */
    .chart {
      width: 100%;
      height: 500px; /* Altura fija para los gráficos */
      min-height: 400px; /* Altura mínima en caso de que el contenedor sea muy pequeño */
    }
    body {
      background-color: #f8f9fa; /* Un fondo suave */
    }
    .navbar {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>

  <!-- Barra de Navegación Superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Análisis Electoral</a>
      <div class="d-flex">
        <a href="/map/{{ mun_id }}" class="btn btn-success me-2">Ver Mapa 🗺️</a>
        <a href="/" class="btn btn-secondary">⬅️ Inicio</a>
      </div>
    </div>
  </nav>

  <!-- Contenedor Principal para los Gráficos -->
  <div class="container">
    <div class="row">
      <!-- Columna para el Gráfico de 2025 -->
      <div class="col-lg-12 mb-4">
        <div class="card">
          <div class="card-header">
            <h3>Votos de la Elección 2025</h3>
          </div>
          <div class="card-body">
            <div id="details_2025" class="chart"></div>
          </div>
        </div>
      </div>
      
      <!-- Columna para el Gráfico de 2021 -->
      <div class="col-lg-12 mb-4">
        <div class="card">
          <div class="card-header">
            <h3>Votos de la Elección 2021</h3>
          </div>
          <div class="card-body">
            <div id="details_2021" class="chart"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Apache ECharts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js"></script>
  <!-- Mis Scripts -->
  <script src="/static/statistics.js"></script>

</body>
</html>
