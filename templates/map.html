
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mapa</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #map {
      flex: 1 1 60%;
      height: 60vh;
      width: 100%;
    }

    #info {
      flex: 1 1 40%;
      max-height: 40vh;
      overflow-y: auto;
      padding: 1em;
      background: #f8f8f8;
    }

    @media (min-width: 768px) {
      body {
        flex-direction: row;
      }

      #map {
        width: 70vw;
        height: 100vh;
      }

      #info {
        width: 30vw;
        height: 100vh;
        max-height: none;
        overflow-y: auto;
      }
    }
  </style>

<!-- Boostrap Styles-->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous"/>


</head>
<body>

  <div id="map"></div>

  <div id="info">
    <h2>Votos de la Elección 2025</h2>

    <hr>
    <h2>Votos de la Elección 2021</h2>

    <hr>

 <!-- Apache eCharts-->
